---
version: 1

defaults:
  indent_spaces: 2
  list:
    remove_dash: true

rules:
  - match: { key: name }
    render:
      show_label: false
      value: { role: name }

  - match: { key: description }
    render:
      show_label: false
      value: { role: plain }

  - match: { key: mode }
    render:
      show_label: true
      label: "MODE"
      value: { role: enum }

  - match: { key: cadence }
    render:
      show_label: true
      label: "CADENCE"
      value: { role: cadence }

  - match: { path: "stages[].jobs[].exercises" }
    render:
      as: exercise_lines
      show_label: false
      template: "{name}{reps}{time}{weight}"
      parts:
        name:
          from: name
          role: exercise_name
        reps:
          when_exists: reps
          format: " x {value}"
          role: number
        time:
          when_exists: work_time_in_seconds
          format: " for {value} secs"
          role: number
        weight:
          when_exists: weight
          format: " x {value} kg"
          role: number