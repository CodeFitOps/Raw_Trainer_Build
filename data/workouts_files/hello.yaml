name: Hello RawTrainer
description: Workout minimo de prueba para validar el motor (custom_sets).
stages:
  - name: Main
    description: Un unico bloque sencillo.
    jobs:
      - name: Full body quickie
        mode: custom_sets
        description: Tres ejercicios, tres rondas.
        rounds: 3
        rest_between_exercises_in_seconds: 15
        rest_between_rounds_in_seconds: 60
        cadence: Regular
        exercises:
          - name: Air Squats
            reps: 20
          - name: Push Ups
            reps: 15
          - name: Plank
            work_time_in_seconds: 45
