<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#201e1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RawTrainer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>RawTrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── tokens. Every colour in the UI resolves from here; themes.js swaps the set. */
  :root {
    --desk:#d7d3d3; --bg:#f3f2f2; --surface:#eae9e9; --ink:#201e1d; --ink2:#2d2b2b;
    --n300:#d7d3d3; --n400:#bab6b6; --n500:#9b9797; --n600:#7d7979; --n700:#605d5d; --n800:#444141;
    --accent:#ec3013; --accent600:#dd2b0f; --accent-deep:#ae1800;
    --accent100:#fff2ef; --accent200:#ffe0d9; --accent300:#ffc4b8; --accent-bright:#ff9783;
    --band-accent:#ff9783; --on-accent:#ffffff; --field:#ffffff;
    --stage-bg:#201e1d; --stage-ink:#f3f2f2; --stage-2:#2d2b2b; --stage-line:#444141;
    --stage-n300:#d7d3d3; --stage-n400:#bab6b6; --stage-n500:#9b9797; --stage-n600:#7d7979;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Archivo', system-ui, sans-serif;
    --gut:60px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  /* native-app feel: no long-press selection/callout on controls (text content stays selectable) */
  button, .tog, .sw, .row, .tabs button, .actions button, .back { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { max-width: 1200px; margin: 0 auto; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); min-height: 100vh; background: var(--bg); }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  a { color: var(--accent-deep); text-decoration: none; border-bottom: 2px solid var(--accent-deep); }
  a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  /* form controls do not inherit colour — without this they fall back to UA black and vanish on dark themes */
  button, input, textarea, select { font: inherit; border-radius: 0; color: inherit; }
  input::placeholder, textarea::placeholder { color: var(--n600); opacity: 1; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); }

  /* ── the index gutter: a 60px column with a 2px rule, running unbroken down every screen */
  .g { display: grid; grid-template-columns: var(--gut) 1fr; }
  .gc { border-right: 2px solid var(--ink); }
  .gc.acc { background: var(--accent); }
  .gc.num { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; color: var(--n600); }
  .spacer { flex: 1; }

  /* ── header */
  .bar { display: grid; grid-template-columns: var(--gut) 1fr; border-bottom: 2px solid var(--ink); position: sticky; top: 0; background: var(--bg); z-index: 5; padding-top: env(safe-area-inset-top); }
  .mark { border-right: 2px solid var(--ink); background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: var(--mono); font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .barin { display: flex; align-items: center; justify-content: space-between; gap: 12px 14px; padding: 10px 16px; flex-wrap: wrap; }
  .brand { font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .22em; cursor: pointer; }
  .crumb { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--n600); }
  .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .swatches { display: flex; flex-direction: column; gap: 3px; padding-right: 10px; border-right: 1px solid var(--n300); }
  .swrow { display: flex; gap: 3px; align-items: center; }
  .swrow > b { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--n700); width: 11px; }
  .sw { width: 20px; height: 20px; border: 2px solid var(--n400); padding: 3px; cursor: pointer; display: block; }
  .sw[aria-pressed="true"] { border-color: var(--ink); padding: 2px; }
  .sw > i { display: block; width: 100%; height: 100%; }
  .tog { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .14em; border: 2px solid var(--ink); padding: 6px 9px; cursor: pointer; text-align: left; background: var(--bg); color: var(--n700); }
  .tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .seg { display: flex; }
  .seg > .tog + .tog { border-left: 0; }

  /* ── shared blocks */
  .display { font-size: 44px; font-weight: 800; line-height: .95; letter-spacing: -.03em; }
  .h1 { font-size: 36px; font-weight: 800; line-height: 1.02; letter-spacing: -.025em; max-width: 22ch; text-wrap: pretty; }
  .lede { font-size: 15px; line-height: 1.5; color: var(--n800); max-width: 64ch; text-wrap: pretty; }
  .note { font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--n700); max-width: 60ch; text-wrap: pretty; }
  .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--n600); }
  .pad { padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .back { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--n700); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; align-self: flex-start; }
  .chip-o { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 3px 6px; border: 1px solid var(--n400); color: var(--n700); }
  .chip-k { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 3px 7px; background: var(--ink); color: var(--bg); }
  .chip-a { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 3px 7px; border: 1px solid var(--accent); color: var(--accent-deep); }
  .filter { border: 0; border-bottom: 2px solid var(--ink); background: none; padding: 8px 0; font-family: var(--mono); font-size: 15px; width: 100%; max-width: 420px; }
  .empty { padding: 16px; font-family: var(--mono); font-size: 13px; color: var(--n600); }

  /* ── library */
  .row { display: grid; grid-template-columns: var(--gut) 1fr auto; align-items: stretch; border: 0; border-bottom: 1px solid var(--n300); background: none; color: var(--ink); width: 100%; text-align: left; cursor: pointer; padding: 0; }
  .row:hover { background: var(--accent100); }
  .row .num { border-right: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--accent-deep); }
  .row .mid { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .row .name { font-size: 19px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .row .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .row .go { display: flex; align-items: center; padding: 0 18px; font-family: var(--mono); font-size: 18px; color: var(--n600); }
  .row.bad .num { color: var(--accent); }

  /* ── actions */
  .actions { display: flex; border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom); }
  .actions button { flex: 1; padding: 20px 16px; font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: .14em; text-align: left; background: var(--bg); color: var(--ink); border: 0; cursor: pointer; }
  .actions button + button { border-left: 2px solid var(--ink); }
  .actions button:hover { background: var(--surface); }
  .actions button.primary { flex: 1.4; background: var(--accent); color: var(--on-accent); }
  .actions button.primary:hover { background: var(--accent600); }

  /* ── detail */
  .map { display: flex; align-items: flex-end; gap: 1px; height: 34px; }
  .map i { display: block; }
  .map i.work { background: var(--accent); height: 34px; }
  .map i.set { background: var(--ink); height: 22px; }
  .map i.rest { background: var(--n300); height: 10px; }
  .map i.prepare { background: var(--accent300); height: 14px; }
  .map i.window, .map i.density, .map i.stopwatch { background: var(--accent); height: 28px; }
  .legend { display: flex; gap: 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--n600); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 8px; height: 8px; display: block; }
  .tabs { display: flex; }
  .tabs button { flex: 1; padding: 12px 16px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-align: left; background: var(--bg); color: var(--n700); border: 0; cursor: pointer; }
  .tabs button + button { border-left: 2px solid var(--ink); }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  /* the poster band: the one place the accent runs as a field */
  .band { background: var(--accent-deep); color: var(--on-accent); border-bottom: 2px solid var(--ink); }
  .band .gc { border-right-color: var(--on-accent); }
  .band .idx { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--on-accent); }
  .band .in { padding: 13px 16px; display: flex; align-items: baseline; gap: 12px; }
  .band .nm { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  .band .ct { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; margin-left: auto; }
  .job { border-bottom: 1px solid var(--n300); }
  .job .num { border-right: 2px solid var(--ink); display: flex; align-items: flex-start; justify-content: center; padding-top: 16px; font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--n600); }
  .job .in { padding: 15px 16px; display: flex; flex-direction: column; gap: 9px; }
  .job .t { font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .job .tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-family: var(--mono); font-size: 12px; margin: 0; }
  .kv dt { color: var(--n600); margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  .kv dd { margin: 0; font-weight: 600; color: var(--n800); }
  .ex { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--surface); padding: 7px 0; font-family: var(--mono); font-size: 12.5px; }
  .ex b { font-weight: 500; }
  .ex span { color: var(--accent-deep); font-weight: 700; white-space: nowrap; }

  /* ── player */
  .player { flex: 1; display: flex; flex-direction: column; background: var(--stage-bg); color: var(--stage-ink); }
  .prog { height: 6px; background: var(--stage-line); display: flex; }
  .prog i { display: block; background: var(--accent); }
  .pcols { flex: 1; display: flex; flex-wrap: wrap; }
  .stagecol { flex: 1 1 380px; min-width: 320px; display: flex; flex-direction: column; min-height: 660px; border-right: 2px solid var(--stage-ink); }
  .pline { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--stage-line); font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--stage-n500); }
  .ticks { display: flex; gap: 2px; padding: 14px 20px 0; }
  .ticks i { flex: 1; height: 4px; background: var(--stage-n600); display: block; }
  .ticks i.done { background: var(--accent); }
  .ticks i.now { background: var(--stage-ink); }
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 26px 20px; }
  .body.top { justify-content: flex-start; gap: 18px; }
  .state { display: flex; align-items: center; gap: 12px; }
  .state i { width: 16px; height: 16px; display: block; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .state span { font-family: var(--mono); font-size: 16px; font-weight: 700; letter-spacing: .28em; }
  .state.rest i, .state.set i { background: var(--stage-ink); animation-duration: 2.8s; }
  .state.rest span, .state.set span { color: var(--stage-n400); }
  .state.prepare i { background: var(--accent300); }
  .state.paused i { background: var(--accent300); animation: none; }
  .state.paused span { color: var(--accent300); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .clock { font-family: var(--mono); font-size: clamp(84px, 17vw, 168px); font-weight: 700; line-height: .82; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .clock.work, .clock.window, .clock.density, .clock.stopwatch { color: var(--accent); }
  .clock.rest { color: var(--stage-n400); }
  .label { font-size: 34px; font-weight: 800; line-height: 1.02; letter-spacing: -.025em; max-width: 20ch; text-wrap: pretty; }
  .sub { font-family: var(--mono); font-size: 14px; color: var(--accent-bright); letter-spacing: .16em; }
  .items { font-family: var(--mono); font-size: 14px; color: var(--stage-n300); display: flex; flex-direction: column; gap: 4px; }
  .hr { height: 1px; background: var(--stage-line); }
  .next { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: baseline; }
  .next .k { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--stage-n600); }
  .next .v { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--stage-n300); }
  .block { padding: 0 20px 14px; font-family: var(--mono); font-size: 11px; color: var(--stage-n600); letter-spacing: .14em; }
  .controls { display: flex; border-top: 2px solid var(--stage-ink); }
  .controls button { min-height: 92px; padding: 0 20px; font-family: var(--mono); font-weight: 700; letter-spacing: .16em; text-align: left; background: var(--stage-bg); color: var(--stage-n400); border: 0; cursor: pointer; font-size: 16px; }
  .controls button:hover { background: var(--stage-2); }
  .controls button.primary { flex: 1.6; background: var(--stage-ink); color: var(--stage-bg); font-size: 20px; }
  .controls button.primary:hover { background: var(--accent300); }
  .controls button.skip { flex: 1; border-left: 2px solid var(--stage-ink); }
  .controls button.quit { width: 78px; border-left: 2px solid var(--stage-ink); color: var(--accent-bright); text-align: center; padding: 0; font-size: 18px; }
  .rail { flex: 0 1 330px; min-width: 290px; display: flex; flex-direction: column; }
  .rail .rh { padding: 18px 20px; border-bottom: 1px solid var(--stage-line); display: flex; flex-direction: column; gap: 5px; }
  .rail .rh .t { font-size: 17px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; }
  .rail .rh .m { font-family: var(--mono); font-size: 11px; color: var(--stage-n600); letter-spacing: .08em; }
  .rail .rs { padding: 10px 20px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .1em; background: var(--stage-2); color: var(--stage-n400); border-left: 4px solid transparent; }
  .rail .rs.now { background: var(--accent); color: var(--on-accent); }
  .rail .rj { padding: 10px 20px; border-bottom: 1px solid var(--stage-line); display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 13px; color: var(--stage-n400); border-left: 4px solid transparent; }
  .rail .rj.now { background: var(--stage-2); color: var(--stage-ink); border-left-color: var(--accent); }
  .rail .rj.done { color: var(--stage-n600); }
  /* forms inside the player sit on the dark stage */
  .player .input { border-color: var(--stage-ink); background: var(--stage-2); color: var(--stage-ink); }
  .player .field label { color: var(--stage-n500); }
  .player .ex { border-top-color: var(--stage-line); }
  .player .ex span { color: var(--accent-bright); }
  .player .kv dt { color: var(--stage-n600); }
  .player .kv dd { color: var(--stage-ink); }
  .player .lede { color: var(--stage-n300); }

  /* ── done */
  .stat { display: flex; flex-wrap: wrap; }
  .stat > div { flex: 1; min-width: 160px; padding: 20px 16px; }
  .stat > div + div { border-left: 2px solid var(--ink); }
  .stat .big { font-family: var(--mono); font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }

  /* ── history */
  .hrow { border-bottom: 1px solid var(--n300); }
  .hrow .num { border-right: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--n600); }
  .hrow .in { padding: 13px 16px; display: flex; flex-direction: column; gap: 7px; }
  .hrow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .hrow .nm { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .hrow .dt { font-family: var(--mono); font-size: 11px; color: var(--n600); letter-spacing: .1em; white-space: nowrap; }
  .hbar { height: 6px; background: var(--surface); display: flex; }
  .hbar i { display: block; background: var(--ink); }
  .total { font-family: var(--mono); font-size: 64px; font-weight: 700; letter-spacing: -.045em; line-height: .9; color: var(--accent-deep); }
  .pr { border-bottom: 1px solid var(--n300); }
  .pr .star { border-right: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 14px; color: var(--accent); }
  .pr .in { padding: 13px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .pr .j { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .pr .m { font-family: var(--mono); font-size: 10px; color: var(--n600); letter-spacing: .1em; }
  .pr .best { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent-deep); white-space: nowrap; letter-spacing: -.02em; }

  /* ── forms */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--n600); }
  .input { border: 2px solid var(--ink); background: var(--field); padding: 14px; font-family: var(--mono); font-size: 12.5px; width: 100%; line-height: 1.7; }
  .drop { border: 2px dashed var(--n400); padding: 16px; }
  .console { background: var(--stage-bg); color: var(--stage-n300); padding: 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.8; white-space: pre-wrap; min-height: 86px; }
  .btnrow { display: flex; align-self: flex-start; }
  .btnrow button { font-family: var(--mono); padding: 15px 20px; font-size: 13px; font-weight: 700; letter-spacing: .14em; background: var(--bg); color: var(--ink); border: 2px solid var(--ink); cursor: pointer; text-align: left; }
  .btnrow button + button { border-left: 0; background: var(--accent); color: var(--on-accent); }

  /* ── raw-mode autocomplete: stages and jobs harvested from workouts you already loaded */
  .loadgrid { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  @media (min-width: 880px) { .loadgrid { grid-template-columns: 1fr 320px; } }
  .ac { border: 2px solid var(--ink); display: flex; flex-direction: column; max-height: 560px; overflow: hidden; }
  .ac .h { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; padding: 9px 12px; background: var(--ink); color: var(--bg); }
  .ac .hint { font-family: var(--mono); font-size: 10px; line-height: 1.6; letter-spacing: .04em; padding: 10px 12px; background: var(--surface); color: var(--n700); }
  .ac .scroll { overflow: auto; }
  .ac .s { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--n300); background: none; color: var(--ink); padding: 9px 12px; cursor: pointer; }
  .ac .s:hover { background: var(--accent100); }
  .ac .s .n { font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
  .ac .s .m { font-family: var(--mono); font-size: 10px; color: var(--n600); letter-spacing: .08em; }
  .ac .mode { border-bottom: 1px solid var(--n300); }
  .ac .mode > .s { border-bottom: 0; }
  .ac .mode.open > .s { background: var(--accent100); }
  .ac .mode .modebody { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .ac .mode .modebody .note { font-size: 11px; line-height: 1.55; }
  .ac .mode .modebody .btnrow button { padding: 10px 14px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

// ── themes. Four light grounds with a deep accent, four dark grounds with a light one.
const L_BASE = {
  desk:"#d7d3d3", bg:"#f3f2f2", surface:"#eae9e9", ink:"#201e1d", ink2:"#2d2b2b",
  n300:"#d7d3d3", n400:"#bab6b6", n500:"#9b9797", n600:"#7d7979", n700:"#605d5d", n800:"#444141",
  "on-accent":"#ffffff", field:"#ffffff",
  "stage-bg":"#201e1d", "stage-ink":"#f3f2f2", "stage-2":"#2d2b2b", "stage-line":"#444141",

// ── safe storage: private-mode Safari and some in-app webviews throw on any
// localStorage access, which would otherwise kill the whole app at boot. Fall
// back to an in-memory map so the session still works (just not persisted).
const store = (() => {
  let ok = true;
  try { localStorage.setItem("rt.__t", "1"); localStorage.removeItem("rt.__t"); }
  catch (e) { ok = false; }
  const mem = {};
  return {
    get(k) { if (ok) { try { return localStorage.getItem(k); } catch (e) {} } return k in mem ? mem[k] : null; },
    set(k, v) { mem[k] = String(v); if (ok) { try { localStorage.setItem(k, v); } catch (e) {} } },
  };
})();

const S = {
  lang: store.get("rt.lang") === "es" ? "es" : "en",
  audio: store.get("rt.audio") !== "0",
  auto: store.get("rt.auto") !== "0",
  theme: THEMES.some((t) => t.key === store.get("rt.theme")) ? store.get("rt.theme") : "red",
  screen: "library", view: "full", query: "",
  library: [], wid: null, workout: null,
  timeline: [], si: 0, left: 0, up: 0, paused: true, driven: true,
  results: {}, note: "", startedAt: null, elapsed: 0, reached: -1,
  stats: null, record: null, stopped: false, msg: "", paste: "", queued: false, schema: null, modesView: false, modeOpen: null,
};
const L = () => STR[S.lang];
const mmss = (s) => { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const g = (n) => String(Number(n));

// ── prescription strings (mirror of preview_v2._prescription_str)
function prescr(o) {
  const parts = [], load = [];
  if (o.distance_in_meters != null) parts.push(g(o.distance_in_meters) + " m");
  if (o.reps != null) parts.push(o.reps + " reps");
  if (o.work_time_in_seconds != null) parts.push(o.work_time_in_seconds + " s");
  if (o.weight != null) load.push(g(o.weight) + " kg");
  if (o.percent_1rm != null) load.push(g(o.percent_1rm) + "% 1RM");
  if (o.rpe != null) load.push("RPE " + g(o.rpe));
  const body = parts.join(" · ");
  if (body && load.length) return body + "  @ " + load.join(" · ");
  return body || (load.length ? "@ " + load.join(" · ") : "—");
}

// ── snippet store: stages and jobs harvested from every workout loaded or imported.
// Names are NOT unique in this domain, so nothing is collapsed by name — only exact duplicates
// (same name AND same body) are dropped, and every variant stays selectable.
const MODE_YAML = { CUSTOM: "custom_sets", FT: "for_time", "CARRY/HOLD": "carry" };
const yq = (s) => {
  s = String(s).replace(/\s+/g, " ").trim();
  return /^[\w][\w \-\/&().,+']*$/.test(s) && !/^(yes|no|true|false|on|off|null)$/i.test(s)
    ? s : '"' + s.replace(/"/g, '\\"') + '"';
};
const yline = (k, v, ind) => (v === null || v === undefined || v === "" ? ""
  : (ind || "  ") + k + ": " + (typeof v === "boolean" || typeof v === "number" ? String(v) : yq(v)) + "\n");

function jobYaml(job) {
  let s = "- name: " + yq(job.name) + "\n";
  const mode = job.mode_label || job.mode || "CUSTOM";
  s += yline("mode", MODE_YAML[mode] || String(mode).toLowerCase());
  if (job.description) s += yline("description", job.description);
  ["rounds","work_time_in_seconds","work_time_in_minutes","interval_in_seconds","rest_time_in_seconds",
   "rest_between_exercises_in_seconds","rest_between_rounds_in_seconds","cadence","tempo"]
    .forEach((k) => { s += yline(k, job[k]); });
  if (job.eccentric_neg) s += yline("eccentric_neg", true);
  if (job.isometric_hold) s += yline("isometric_hold", true);
  const exs = job.exercises || [];
  if (exs.length) {
    s += "  exercises:\n";
    exs.forEach((ex) => {
      s += "    - name: " + yq(ex.name) + "\n";
      ["reps","work_time_in_seconds","distance_in_meters","weight","percent_1rm","rpe","notes"]
        .forEach((k) => { s += yline(k, ex[k], "      "); });
    });
  }
  return s.replace(/\n$/, "");
}
function stageYaml(st) {
  let s = "- name: " + yq(st.name) + "\n";
  if (st.description) s += yline("description", st.description);
  s += "  jobs:\n";
  (st.jobs || []).forEach((j) => { s += jobYaml(j).split("\n").map((x) => "    " + x).join("\n") + "\n"; });
  return s.replace(/\n$/, "");
}
function getSnips() {
  try { const j = JSON.parse(store.get("rt.snips") || "{}"); return { stages: j.stages || [], jobs: j.jobs || [] }; }
  catch (e) { return { stages: [], jobs: [] }; }
}
function harvest(wk) {
  if (!wk || !wk.stages) return;
  const s = getSnips(), src = wk.name || "?";
  wk.stages.forEach((st) => {
    s.stages.push({ name: st.name, src: src, yaml: stageYaml(st) });
    (st.jobs || []).forEach((j) => s.jobs.push({ name: j.name, src: src, mode: j.mode_label || j.mode, yaml: jobYaml(j) }));
  });
  const uniq = (a) => { const seen = {}; return a.filter((x) => { const k = x.name + "\u0000" + x.yaml; if (seen[k]) return false; seen[k] = 1; return true; }); };
  s.stages = uniq(s.stages).slice(-300);
  s.jobs = uniq(s.jobs).slice(-600);
  store.set("rt.snips", JSON.stringify(s));
}

// ── API
async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {}));
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

// ── run queue: a finished session must never be lost to gym wifi dropping.
// A save that fails is parked in localStorage and retried on reconnect / next
// load, keyed by client_id so a retry can never double-count a session.
function runId() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return "r-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}
function loadQueue() { try { return JSON.parse(store.get("rt.runq") || "[]"); } catch (e) { return []; } }
function saveQueue(q) { store.set("rt.runq", JSON.stringify(q)); }
function queueRun(record) {
  const q = loadQueue();
  if (!q.some((r) => r.client_id === record.client_id)) { q.push(record); saveQueue(q); }
}
let flushing = false;
async function flushQueue() {
  if (flushing) return;
  const q = loadQueue();
  if (!q.length) return;
  flushing = true;
  const keep = [];
  let flushed = 0;
  for (const rec of q) {
    try { await api("/api/runs", { method: "POST", body: JSON.stringify(rec) }); flushed++; }
    catch (e) { keep.push(rec); }   // still unreachable — keep it for the next attempt
  }
  saveQueue(keep);
  flushing = false;
  if (flushed && S.screen === "history") goHistory();   // refresh stats to show what just synced
}

// ── audio
let AC = null;
// iOS/Safari start the AudioContext "suspended" and only resume it from a user
// gesture. The session begins after an await (off the gesture), so prime/resume
// on interaction — without this the countdown beeps are silent on iPhone.
function primeAudio() {
  if (!S.audio) return null;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e) { return null; }
  return AC;
}
function beep(freq, dur) {
  const ac = primeAudio();
  if (!ac) return;
  try {
    const o = ac.createOscillator(), gain = ac.createGain();
    o.type = "square"; o.frequency.value = freq; gain.gain.value = 0.06;
    o.connect(gain); gain.connect(ac.destination); o.start(); o.stop(ac.currentTime + (dur || 0.09));
  } catch (e) {}
}
function say(text) {
  if (!S.audio || !text) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = S.lang === "es" ? "es-ES" : "en-GB"; u.rate = 1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

// ── screen wake lock: keep the phone awake the whole time a session screen is open
const RawWake = (() => {
  let sentinel = null, pending = false, want = false;
  async function acquire() {
    if (sentinel || pending || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    pending = true;
    try {
      sentinel = await navigator.wakeLock.request("screen");
      sentinel.addEventListener("release", () => { sentinel = null; });
    } catch (e) { /* denied or page hidden — ignore, we retry on visibility */ }
    finally { pending = false; }
  }
  async function release() { if (sentinel) { try { await sentinel.release(); } catch (e) {} sentinel = null; } }
  // the OS drops the lock when the tab is hidden; re-acquire when we come back
  document.addEventListener("visibilitychange", () => {
    if (want && document.visibilityState === "visible") acquire();
  });
  return { set(on) { want = on; if (on) acquire(); else release(); } };
})();
function syncWake() { RawWake.set(S.screen === "player"); }

// ── haptics: a short buzz alongside the audio cues (Android; silently ignored where unsupported)
function haptic(pattern) { try { if (S.audio && navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }

// ── clock
setInterval(() => {
  syncWake();
  if (S.screen !== "player" || S.paused) return;
  const n = S.timeline[S.si];
  if (!n || n.type !== "seg") return;
  if (n.seg.kind === "stopwatch") { S.up++; S.elapsed++; return render(); }
  if (!n.seg.duration_seconds) return;
  S.left--; S.elapsed++;
  if (S.left <= 3 && S.left > 0) { beep(880, 0.08); haptic(30); }
  if (S.left <= 0) { beep(1320, 0.22); haptic([0, 120]); return advance(); }
  render();
}, 1000);

function enter(i) {
  const n = S.timeline[i];
  if (!n) return finish(true);
  S.si = i;
  S.reached = Math.max(S.reached, i);
  if (n.type === "seg") {
    S.left = n.seg.duration_seconds; S.up = 0;
    S.paused = !(n.seg.duration_seconds > 0 || n.seg.kind === "stopwatch");
    beep(660, 0.1); haptic(60);
    const chip = L().chip[n.seg.kind] || "";
    const round = n.seg.total_rounds ? `${L().round} ${n.seg.round_index} / ${n.seg.total_rounds}` : "";
    const label = n.seg.kind === "prepare" ? (S.timeline[i+1] && S.timeline[i+1].type === "seg" ? S.timeline[i+1].seg.label : n.job.name) : n.seg.label;
    say([chip, label, round].filter(Boolean).join(". "));
  } else {
    S.paused = true;
    if (n.type === "brief") say(n.job.name);
  }
  render();
}
function advance() { const nx = S.si + 1; if (nx >= S.timeline.length) return finish(true); enter(nx); }

function jobReached(sIdx, jIdx, completed) {
  if (completed) return true;
  let last = -1;
  S.timeline.forEach((n, i) => { if (n.stage_index === sIdx && n.job_index === jIdx) last = i; });
  return last > -1 && last < S.si;
}

async function finish(completed) {
  const wk = S.workout;
  const record = {
    version: 2, session_mode: S.driven ? "driven" : "descriptive",
    client_id: runId(),
    workout_name: wk.name, workout_description: wk.description,
    source_file: S.wid, started_at: S.startedAt, duration_seconds: S.elapsed,
    overall_note: S.note || null, completed: !!completed,
    stages: wk.stages.map((stage, si) => ({
      index: si + 1, name: stage.name, description: stage.description,
      jobs: stage.jobs
        .map((job, ji) => ({ job, ji }))
        .filter(({ ji }) => jobReached(si + 1, ji + 1, completed))
        .map(({ job, ji }) => Object.assign({ index: ji + 1, name: job.name, mode: job.mode }, S.results[(si+1)+":"+(ji+1)] || {})),
    })).filter((st) => st.jobs.length),
  };
  S.record = record; S.stopped = !completed; S.screen = "done"; S.paused = true; S.msg = ""; S.queued = false;
  render();
  try {
    await api("/api/runs", { method: "POST", body: JSON.stringify(record) });
    flushQueue();   // opportunistically drain any runs queued on an earlier offline finish
  } catch (e) {
    queueRun(record); S.queued = true; render();   // offline/unreachable — keep it and sync later
  }
}

function setResult(key, value) {
  const n = S.timeline[S.si];
  if (!n) return;
  const id = n.stage_index + ":" + n.job_index;
  S.results[id] = Object.assign({}, S.results[id], { [key]: value });
}
function bestPrevious(jobName, key) {
  if (!S.stats) return null;
  const hit = S.stats.prs.find((p) => p.job === jobName && p.key === key);
  return hit ? hit.best : null;
}

// ── navigation
async function goLibrary() {
  S.screen = "library"; render();
  try { S.library = await api("/api/library"); S.msg = ""; }
  catch (e) { S.msg = L().offline; }
  render();
}
async function openWorkout(id) {
  S.wid = id; S.screen = "detail"; S.workout = null; render();
  try { const d = await api("/api/workouts/" + encodeURIComponent(id)); S.workout = d.workout; harvest(d.workout); }
  catch (e) { S.msg = String(e.message); }
  render();
}
async function startRun(driven) {
  S.driven = driven;
  try {
    const [d, stats] = await Promise.all([
      api(`/api/workouts/${encodeURIComponent(S.wid)}/timeline?driven=${driven ? "true" : "false"}`),
      api("/api/stats").catch(() => null),
    ]);
    S.workout = d.workout; S.timeline = d.timeline; S.stats = stats; harvest(d.workout);
    S.results = {}; S.note = ""; S.elapsed = 0; S.reached = -1;
    S.startedAt = new Date().toISOString().slice(0, 19);
    S.screen = "player";
    enter(0);
  } catch (e) { S.msg = String(e.message); render(); }
}
async function goHistory() {
  S.screen = "history"; render();
  try { S.stats = await api("/api/stats"); S.msg = ""; }
  catch (e) { S.msg = L().offline; }
  render();
}
function goLoad() {
  S.screen = "load"; S.msg = ""; render();
  // key hints, distilled from the real JSON Schemas (fetched once; refreshAC falls back meanwhile)
  if (!S.schema) api("/api/schema").then((h) => { S.schema = h; if (S.screen === "load") refreshAC(); }).catch(() => {});
}

async function validatePaste(doImport) {
  const text = S.paste.trim();
  if (!text) return;
  try {
    if (doImport) {
      const d = await api("/api/import", { method: "POST", body: JSON.stringify({ text }) });
      S.msg = `✅ ${d.workout.n_stages} ${L().stages}, ${d.workout.n_jobs} ${L().jobs}\n${d.workout.name}\n→ ${d.file}${d.replaced ? " (replaced)" : ""}`;
      S.library = await api("/api/library");
      await harvestImported(d.workout && d.workout.name);
    } else {
      const d = await api("/api/validate", { method: "POST", body: JSON.stringify({ text }) });
      S.msg = d.valid
        ? `✅ ${d.workout.n_stages} ${L().stages}, ${d.workout.n_jobs} ${L().jobs}\n${d.workout.name}`
        : `❌ ${d.error}`;
    }
  } catch (e) { S.msg = "❌ " + e.message; }
  render();
}
async function uploadFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  try {
    const res = await fetch("/api/import", { method: "POST", body: fd });
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || res.statusText);
    S.msg = `✅ ${d.workout.n_stages} ${L().stages}, ${d.workout.n_jobs} ${L().jobs}\n${d.workout.name}\n→ ${d.file}`;
    S.library = await api("/api/library");
    await harvestImported(d.workout && d.workout.name);
  } catch (e) { S.msg = "❌ " + e.message; }
  render();
}

// A freshly imported file only comes back as a summary — re-read it so its blocks are harvested too.
async function harvestImported(name) {
  if (!name) return;
  const hit = S.library.find((w) => w.name === name);
  if (!hit) return;
  try { const d = await api("/api/workouts/" + encodeURIComponent(hit.id)); harvest(d.workout); } catch (e) {}
}

// ── views
function jobMetaRows(job) {
  const l = L(), rows = [];
  if (job.rounds != null) rows.push([l.rounds, job.rounds]);
  if (job.cadence) rows.push([l.cadence, job.cadence]);
  if (job.tempo) rows.push([l.tempo, job.tempo]);
  if (job.interval_in_seconds) rows.push([l.interval, job.interval_in_seconds + l.secs]);
  const time = [];
  if (job.work_time_in_seconds) time.push(l.work + job.work_time_in_seconds + l.secs);
  if (job.work_time_in_minutes) time.push(l.window + job.work_time_in_minutes + " min");
  if (job.rest_time_in_seconds) time.push(l.rest.toLowerCase() + " " + job.rest_time_in_seconds + l.secs);
  if (time.length) rows.push([l.time, time.join(" · ")]);
  const rest = [];
  if (job.rest_between_exercises_in_seconds) rest.push(job.rest_between_exercises_in_seconds + l.restEx);
  if (job.rest_between_rounds_in_seconds) rest.push(job.rest_between_rounds_in_seconds + l.restRd);
  if (rest.length) rows.push([l.rest, rest.join(" · ")]);
  const tech = [];
  if (job.eccentric_neg) tech.push(l.techEcc);
  if (job.isometric_hold) tech.push(l.techIso);
  if (tech.length) rows.push([l.technique, tech.join(" · ")]);
  return rows;
}

/* The session map: one bar per timeline block, width proportional to its duration.
   Built from the same executor output the player runs, so it can't drift from reality. */
function sessionMap(wk) {
  const l = L();
  const segs = [];
  wk.stages.forEach((st) => st.jobs.forEach((job) => {
    const rounds = job.rounds || 1, exs = job.exercises || [];
    const rEx = job.rest_between_exercises_in_seconds || 0, rRd = job.rest_between_rounds_in_seconds || 0;
    segs.push({ kind: "prepare", d: 10 });
    for (let r = 1; r <= rounds; r++) {
      exs.forEach((ex, ei) => {
        segs.push({ kind: ex.work_time_in_seconds ? "work" : "set", d: ex.work_time_in_seconds || 0 });
        if (rEx && ei < exs.length - 1) segs.push({ kind: "rest", d: rEx });
      });
      if (rRd && r < rounds) segs.push({ kind: "rest", d: rRd });
    }
  }));
  const timed = segs.reduce((a, x) => a + x.d, 0);
  return `<div class="g" style="border-bottom:2px solid var(--ink)">
    <div class="gc num" style="font-size:9px;letter-spacing:.1em">${l.map}</div>
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">
      <div class="map">${segs.map((x) => `<i class="${x.kind}" style="flex:${Math.max(3, x.d || 8)}"></i>`).join("")}</div>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>${l.chip.work}</span>
        <span><i style="background:var(--ink)"></i>${l.chip.set}</span>
        <span><i style="background:var(--n300)"></i>${l.chip.rest}</span>
        <span style="margin-left:auto">${segs.length} ${l.blocks} · ${Math.round(timed / 60)} ${l.minTimed}</span>
      </div>
    </div>
  </div>`;
}

function viewDetail() {
  const l = L(), wk = S.workout;
  if (!wk) return `${viewBar()}<div class="empty">${esc(S.msg) || l.loading}</div>`;
  let body = "";
  wk.stages.forEach((stage, si) => {
    body += `<div class="band g">
      <div class="gc idx">${String(si + 1).padStart(2, "0")}</div>
      <div class="in"><span class="nm">${esc(stage.name.toUpperCase())}</span><span class="ct">${stage.jobs.length} ${l.jobs.toUpperCase()}</span></div>
    </div>`;
    stage.jobs.forEach((job, ji) => {
      const tags = `<span class="chip-k">${esc(job.mode_label)}</span>`
        + (job.isometric_hold ? `<span class="chip-a">HOLD</span>` : "")
        + (job.eccentric_neg ? `<span class="chip-a">NEG</span>` : "");
      let extra = "";
      if (S.view === "full") {
        extra += kvHtml(jobMetaRows(job));
        extra += `<div>${job.exercises.map((ex, i) => `<div class="ex"><b>${String(i+1).padStart(2,"0")} ${esc(ex.name)}</b><span>${esc(prescr(ex))}</span></div>`).join("")}</div>`;
      }
      body += `<div class="job g">
        <div class="num">${String(ji + 1).padStart(2, "0")}</div>
        <div class="in">
          <div class="t">${esc(job.name)}</div>
          <div class="tags">${tags}<span class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--n600)">${job.rounds ? job.rounds + " × " : ""}${job.exercises.length} ${l.ex}</span></div>
          ${extra}
        </div>
      </div>`;
    });
  });
  return `${viewBar()}
    <div class="g" style="border-bottom:2px solid var(--ink)">
      <div class="gc acc"></div>
      <div class="pad">
        <button class="back" data-go="library">← ${l.back}</button>
        <div class="h1">${esc(wk.name)}</div>
        <div class="lede">${esc(wk.description || "")}</div>
        <div class="row-tags" style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="chip-o" style="border-color:var(--ink);color:var(--ink)">${wk.n_stages} ${l.stages.toUpperCase()}</span>
          <span class="chip-o" style="border-color:var(--ink);color:var(--ink)">${wk.n_jobs} ${l.jobs.toUpperCase()}</span>
        </div>
      </div>
    </div>
    ${sessionMap(wk)}
    <div class="g" style="border-bottom:2px solid var(--ink)">
      <div class="gc"></div>
      <div class="tabs">
        <button data-view="compact" aria-pressed="${S.view === "compact"}">${l.compact}</button>
        <button data-view="full" aria-pressed="${S.view === "full"}">${l.full}</button>
      </div>
    </div>
    ${body}
    <div class="actions" style="position:sticky;bottom:0">
      <button class="primary" data-start="driven">▶ ${l.driven}</button>
      <button data-start="own">${l.ownPace}</button>
    </div>`;
}

function viewPlayer() {
  const l = L(), wk = S.workout, n = S.timeline[S.si];
  if (!n) return viewBar();
  const jobSegs = S.timeline.filter((x) => x.type === "seg" && x.stage_index === n.stage_index && x.job_index === n.job_index);
  const idx = n.type === "seg" ? jobSegs.indexOf(n) + 1 : 0;
  const ticks = jobSegs.map((x, i) => `<i class="${i + 1 < idx ? "done" : i + 1 === idx ? "now" : ""}"></i>`).join("");
  const leftInJob = jobSegs.slice(Math.max(0, idx - 1)).reduce((a, x) => a + (x.seg.duration_seconds || 0), 0);
  const pct = Math.round(((S.si + 1) / S.timeline.length) * 100);

  let body = "", primary = l.start;
  if (n.type === "brief") {
    body = `<div class="body top">
      <div class="mono" style="font-size:11px;letter-spacing:.18em;color:var(--accent-bright)">${l.jobOf} ${n.job_index}/${n.jobs_in_stage} · ${esc(n.job.mode_label)}</div>
      <div class="label" style="font-size:38px">${esc(n.job.name)}</div>
      <div class="lede">${esc(n.job.description || n.job.mode_description || "")}</div>
      ${kvHtml(jobMetaRows(n.job))}
      <div>${n.job.exercises.map((ex) => `<div class="ex"><b>${esc(ex.name)}</b><span>${esc(prescr(ex))}</span></div>`).join("")}</div>
    </div>`;
  } else if (n.type === "result") {
    const cur = S.results[n.stage_index + ":" + n.job_index] || {};
    let fields = "", pr = "";
    if (n.job.mode === "AMRAP") {
      fields = `<div class="field"><label>${l.askRounds}</label><input class="input" type="number" inputmode="numeric" value="${cur.result_rounds ?? ""}" data-res="result_rounds"></div>
                <div class="field"><label>${l.askReps}</label><input class="input" type="number" inputmode="numeric" value="${cur.result_reps ?? ""}" data-res="result_reps"></div>`;
      const best = bestPrevious(n.job.name, "result_rounds");
      if (cur.result_rounds != null) pr = best == null ? `${l.prFirst}: ${cur.result_rounds}` : cur.result_rounds > best ? `${l.prNew} ${cur.result_rounds} (${best})` : `${l.prCur}: ${best}`;
    } else if (n.job.mode === "EDT") {
      fields = n.job.exercises.map((ex, i) => `<div class="field"><label>${l.askRepsOf} ${esc(ex.name.toUpperCase())}</label><input class="input" type="number" inputmode="numeric" value="${cur["reps_" + i] ?? ""}" data-res="reps_${i}" data-total="1"></div>`).join("");
    } else {
      const t = cur.result_time_seconds;
      const best = bestPrevious(n.job.name, "result_time_seconds");
      if (t != null) pr = best == null ? `${l.prFirst}: ${mmss(t)}` : t < best ? `${l.prNew} ${mmss(t)} (${mmss(best)})` : `${l.prCur}: ${mmss(best)}`;
    }
    body = `<div class="body top">
      <div class="mono" style="font-size:11px;letter-spacing:.18em;color:var(--accent-bright)">${l.result}</div>
      <div class="label">${esc(n.job.name)}</div>
      ${fields}
      ${pr ? `<div class="mono" style="font-size:14px;color:var(--accent-bright)">${esc(pr)}</div>` : ""}
      <div class="field"><label>${l.note}</label><input class="input" type="text" value="${esc(S.note)}" data-note="1"></div>
    </div>`;
    primary = l.done;
  } else {
    const sg = n.seg, k = sg.kind;
    const pausedNow = S.paused && sg.duration_seconds > 0;
    const stateCls = pausedNow ? "paused" : k;
    const stateTxt = pausedNow ? l.chip.paused : (l.chip[k] || "");
    const clock = k === "stopwatch" ? mmss(S.up) : sg.duration_seconds ? mmss(S.left) : "--:--";
    const label = k === "prepare" ? (S.timeline[S.si+1] && S.timeline[S.si+1].type === "seg" ? S.timeline[S.si+1].seg.label : n.job.name) : sg.label;
    const nx = S.timeline[S.si + 1];
    const nextTxt = !nx ? l.workoutDone
      : nx.type === "seg" ? `${l.chip[nx.seg.kind] || ""} ${nx.seg.duration_seconds ? nx.seg.duration_seconds + l.secs : ""} · ${nx.seg.label}`
      : nx.type === "brief" ? nx.job.name : `${l.result} · ${nx.job.name}`;
    const items = (sg.items || []).concat(sg.manual ? [l.noTimer] : []);
    body = `<div class="body">
      <div class="state ${stateCls}"><i></i><span>${stateTxt}</span></div>
      <div class="clock ${pausedNow ? "" : k}">${clock}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="label">${esc(label)}</div>
        ${sg.total_rounds ? `<div class="sub">${l.round} ${sg.round_index}/${sg.total_rounds}</div>` : ""}
      </div>
      ${items.length ? `<div class="items">${items.map((t) => "· " + esc(t)).join("")}</div>` : ""}
      <div class="hr"></div>
      <div class="next"><div class="k">${l.next}</div><div class="v">${esc(nextTxt)}</div></div>
    </div>`;
    primary = k === "stopwatch" || !sg.duration_seconds ? l.done : (S.paused ? l.resume : l.pause);
  }

  let rail = `<div class="rail"><div class="rh">
      <div class="kicker">${l.plan}</div>
      <div class="t">${esc(wk.name)}</div>
      <div class="m">${wk.n_stages} ${l.stages} · ${wk.n_jobs} ${l.jobs}</div>
    </div><div style="flex:1">`;
  wk.stages.forEach((stage, si) => {
    const now = n.stage_index === si + 1;
    rail += `<div class="rs ${now ? "now" : ""}">${l.stageOf} ${si + 1} · ${esc(stage.name.toUpperCase())}</div>`;
    stage.jobs.forEach((job, ji) => {
      const done = si + 1 < n.stage_index || (si + 1 === n.stage_index && ji + 1 < n.job_index);
      const isNow = si + 1 === n.stage_index && ji + 1 === n.job_index;
      rail += `<div class="rj ${isNow ? "now" : done ? "done" : ""}"><span>${ji + 1}. ${esc(job.name)}</span><span>${done ? "✔" : isNow ? "▶" : ""}</span></div>`;
    });
  });
  rail += "</div></div>";

  return `${viewBar()}
    <div class="player">
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="pcols">
        <div class="stagecol">
          <div class="pline"><span>${l.stageOf} ${n.stage_index}/${wk.n_stages} · ${esc(n.stage_name.toUpperCase())}</span><span>${l.jobOf} ${n.job_index}/${n.jobs_in_stage}</span></div>
          <div class="ticks">${ticks}</div>
          ${body}
          <div class="block">${l.block} ${Math.max(1, idx)}/${jobSegs.length} · ${mmss(leftInJob)}</div>
          <div class="controls">
            <button class="primary" data-primary="1">${primary}</button>
            <button class="skip" data-skip="1">${l.skip}</button>
            <button class="quit" data-quit="1">✕</button>
          </div>
        </div>
        ${rail}
      </div>
    </div>`;
}

function viewDone() {
  const l = L(), rec = S.record;
  let jobs = 0; const rows = [];
  (rec.stages || []).forEach((st) => (st.jobs || []).forEach((j) => {
    jobs++;
    const vals = [];
    if (j.result_time_seconds != null) vals.push(mmss(j.result_time_seconds));
    if (j.result_rounds != null) vals.push(j.result_rounds + " rounds");
    if (j.result_reps != null) vals.push("+" + j.result_reps + " reps");
    if (j.result_total_reps != null) vals.push(j.result_total_reps + " reps");
    if (vals.length) rows.push(`<div class="ex"><b>${esc(j.name)}</b><span>${esc(vals.join(" · "))}</span></div>`);
  }));
  return `${viewBar()}
    <div class="g" style="border-bottom:2px solid var(--ink)">
      <div class="gc acc"></div>
      <div style="padding:26px 16px;display:flex;flex-direction:column;gap:12px">
        <div class="kicker" style="color:var(--accent-deep)">${S.stopped ? l.stopped : l.workoutDone}</div>
        <div class="h1" style="font-size:40px">${esc(rec.workout_name)}</div>
      </div>
    </div>
    <div class="g" style="border-bottom:2px solid var(--ink)">
      <div class="gc acc"></div>
      <div class="stat">
        <div><div class="kicker">${l.total}</div><div class="big">${mmss(rec.duration_seconds)}</div></div>
        <div><div class="kicker">${l.jobsDone}</div><div class="big">${jobs}</div></div>
      </div>
    </div>
    ${rows.length ? `<div class="g"><div class="gc"></div><div style="padding:4px 16px 12px">${rows.join("")}</div></div>` : ""}
    <div class="g"><div class="gc"></div><div class="note" style="padding:16px">${S.msg ? "❌ " + esc(S.msg) : S.queued ? esc(l.savedOffline) : l.saved}</div></div>
    <div class="spacer g"><div class="gc"></div><div></div></div>
    <div class="actions">
      <button class="primary" data-go="library">${l.library}</button>
      <button data-go="history">${l.history}</button>
    </div>`;
}

function viewHistory() {
  const l = L(), st = S.stats;
  if (!st) return `${viewBar()}<div class="empty">${esc(S.msg) || l.loading}</div>`;
  const now = Date.now();
  const max = Math.max(1, ...st.by_workout.map((r) => r.sessions));
  const rows = st.by_workout.map((r) => {
    const days = r.last ? Math.max(0, Math.round((now - new Date(r.last).getTime()) / 86400000)) : null;
    const avg = Math.round(r.total_seconds / r.sessions / 60);
    return `<div class="hrow g">
      <div class="num">${r.sessions}</div>
      <div class="in">
        <div class="top">
          <span class="nm">${esc(r.workout.length > 30 ? r.workout.slice(0, 29) + "…" : r.workout)}</span>
          <span class="dt">${days == null ? "—" : days + l.ago} · ${avg}${l.avgShort}</span>
        </div>
        <div class="hbar"><i style="width:${Math.round((r.sessions / max) * 100)}%"></i></div>
      </div>
    </div>`;
  }).join("");
  const prs = st.prs.map((p) => `<div class="pr g">
      <div class="star">★</div>
      <div class="in">
        <div><div class="j">${esc(p.job)}</div><div class="m">${esc(p.mode || "")} · ${esc(p.workout)} · ${p.attempts} ${l.attempts}</div></div>
        <div class="best">${p.unit === "seconds" ? mmss(p.best) : p.best + " " + p.unit}</div>
      </div>
    </div>`).join("");
  return `${viewBar()}
    <div class="g" style="border-bottom:2px solid var(--ink)">
      <div class="gc acc"></div>
      <div style="padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px">
        <button class="back" data-go="library">← ${l.back}</button>
        <div class="kicker">${l.total}</div>
        <div class="total">${Math.floor(st.total_seconds/3600)}h ${Math.floor((st.total_seconds%3600)/60)}m</div>
        <div class="mono" style="font-size:11px;color:var(--n600);letter-spacing:.14em">${st.sessions} ${l.sessions}</div>
      </div>
    </div>
    ${rows}
    ${prs ? `<div class="band g" style="border-top:2px solid var(--ink)"><div class="gc"></div><div class="in"><span class="mono" style="font-size:11px;font-weight:700;letter-spacing:.2em">${l.prTitle}</span></div></div>${prs}` : ""}
    ${st.sessions ? "" : `<div class="empty">${l.noHistory}</div>`}`;
}

function viewLoad() {
  const l = L();
  return `${viewBar()}
    <div class="g" style="flex:1">
      <div class="gc acc"></div>
      <div class="pad" style="gap:14px">
        <button class="back" data-go="library">← ${l.back}</button>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div class="h1" style="font-size:32px">${l.loadTitle}</div>
          <div class="seg">
            <button class="tog" data-auto="1" aria-pressed="${S.auto}">${S.auto ? l.autoOn : l.autoOff}</button>
            <button class="tog" data-modes="1" aria-pressed="${S.modesView}">${S.modesView ? "✕ MODES" : "？ MODES"}</button>
          </div>
        </div>
        <div class="note">${l.loadHint}</div>
        <div class="drop"><input type="file" accept=".yaml,.yml" data-file="1" class="mono" style="width:100%;font-size:12px"></div>
        <div class="loadgrid">
          <div style="display:flex;flex-direction:column;gap:14px">
            <textarea class="input" data-paste="1" rows="18" style="resize:vertical" placeholder="name: My Workout&#10;stages:&#10;  - name: WU&#10;    jobs:&#10;      - name: Warm-up&#10;        mode: custom_sets&#10;        rounds: 2&#10;        exercises:&#10;          - name: Jumping Jacks&#10;            work_time_in_seconds: 30">${esc(S.paste)}</textarea>
            <div class="btnrow">
              <button data-validate="1">${l.validate}</button>
              <button data-import="1">${l.import}</button>
            </div>
            <div class="console">${esc(S.msg)}</div>
          </div>
          ${(S.auto || S.modesView) ? `<div class="ac" id="ac"></div>` : ""}
        </div>
      </div>
    </div>`;
}

/* The suggestion list. Filter comes from the line the caret is on, so typing in the
   textarea narrows it the way an autocomplete should — no second search box. */
// ── schema-aware key autocomplete. Hints come from /api/schema (distilled from the real
// JSON Schemas → no drift); a tiny fallback keeps it useful before that request lands.
const HINT_FALLBACK = {
  workout: { keys: ["name", "description", "tags", "stages"] },
  stage: { keys: ["name", "description", "tags", "jobs"] },
  exercise: { keys: ["name", "reps", "work_time_in_seconds", "distance_in_meters", "weight", "percent_1rm", "rpe"] },
  job: { byMode: {} },
};
const CONTAINER_KEYS = { stages: 1, jobs: 1, exercises: 1 };
function hints() { return S.schema || HINT_FALLBACK; }
function levelKeys(level, mode) {
  const h = hints();
  if (level === "job") {
    const bm = h.job && h.job.byMode && (h.job.byMode[mode] || null);
    return (bm && bm.keys) || ["name", "mode", "description", "tags", "exercises"];
  }
  return (h[level] && h[level].keys) || [];
}
const _ind = (s) => (s.match(/^ */)[0]).length;
// Which level of the tree the caret is in (workout/stage/job/exercise) + the job's mode.
function yamlContext(text, pos) {
  const all = text.split("\n");
  const curIdx = text.slice(0, pos).split("\n").length - 1;
  const indent = _ind(all[curIdx] || "");
  let level = "workout", cont = -1;
  for (let i = curIdx; i >= 0; i--) {
    const ind = _ind(all[i]);
    if (i !== curIdx && ind >= indent) continue;
    const m = all[i].match(/^ *(stages|jobs|exercises) *:/);
    if (m && ind < indent) { level = m[1] === "exercises" ? "exercise" : m[1] === "jobs" ? "job" : "stage"; cont = ind; break; }
  }
  let mode = null;
  if (level === "job" || level === "exercise") {
    const jki = level === "exercise" ? cont : (/^ *- /.test(all[curIdx]) ? indent + 2 : indent);
    let start = 0;
    for (let i = curIdx; i >= 0; i--) {
      const ind = _ind(all[i]);
      if (ind < jki && /^ *(jobs|stages) *:/.test(all[i])) { start = i + 1; break; }
      if (/^ *- /.test(all[i]) && ind === jki - 2) { start = i; break; }
    }
    let end = all.length - 1;
    for (let i = start + 1; i < all.length; i++) {
      const ln = all[i]; if (!ln.trim()) continue; const ind = _ind(ln);
      if (ind < jki || (ind === jki - 2 && /^ *- /.test(ln))) { end = i - 1; break; }
    }
    for (let i = start; i <= end; i++) {
      const mm = all[i].match(/^ *mode *: *['"]?([A-Za-z_]+)/);
      if (mm && _ind(all[i]) === jki) { mode = mm[1].toLowerCase(); break; }
    }
  }
  return { level, mode };
}
// The partial key being typed on the current line (null when the caret is in a value).
function caretKeyPrefix() {
  const ta = document.querySelector("[data-paste]");
  if (!ta) return null;
  const line = ta.value.slice(0, ta.selectionStart || 0).split("\n").pop();
  const after = line.replace(/^\s*(-\s+)?/, "");
  if (after.indexOf(":") > -1) return null;      // typing a value, not a key
  return after.replace(/[^A-Za-z_]/g, "").toLowerCase();
}
// Insert a key at the caret (replacing the partial word). Container keys open a child list.
function insertKey(key) {
  const ta = document.querySelector("[data-paste]");
  if (!ta) return;
  const pos = ta.selectionStart || 0, val = ta.value;
  const lineStart = val.lastIndexOf("\n", pos - 1) + 1;
  const partial = (val.slice(lineStart, pos).match(/[A-Za-z_]*$/) || [""])[0];
  const indent = _ind(val.slice(lineStart));
  const ins = CONTAINER_KEYS[key] ? key + ":\n" + " ".repeat(indent + 2) + "- " : key + ": ";
  const from = pos - partial.length;
  const next = val.slice(0, from) + ins + val.slice(pos);
  ta.value = next; S.paste = next;
  const caret = from + ins.length;
  ta.focus(); ta.setSelectionRange(caret, caret);
  refreshAC();
}

let ACL = { stages: [], jobs: [] };
function caretQuery() {
  const ta = document.querySelector("[data-paste]");
  if (!ta) return "";
  const line = ta.value.slice(0, ta.selectionStart || 0).split("\n").pop();
  return line.replace(/^[\s\-]*/, "").replace(/^name:\s*/i, "").trim().toLowerCase();
}
// ── modes reference: a toggle-in panel of expandable cards. Purpose + required/optional
// keys per mode come straight from /api/schema (label + description from the domain enum),
// so the guide can never drift from what the engine actually accepts. ＋ inserts a skeleton.
function renderModes(box) {
  const l = L(), h = hints();
  const modes = (h.modes || []).filter((m) => m !== "super_sets");
  const cards = modes.map((m) => {
    const spec = (h.job && h.job.byMode && h.job.byMode[m]) || {};
    const label = spec.label || m.toUpperCase();
    const desc = spec.description || "";
    const short = desc.split(". ")[0].replace(/^[A-ZÁÉÍÓÚ/ _]+:\s*/, "");
    const req = (spec.required || []).filter((k) => k !== "mode" && k !== "name").join(" · ");
    const uses = (spec.keys || []).filter((k) => (spec.required || []).indexOf(k) < 0 && k !== "exercises").join(" · ");
    const open = S.modeOpen === m;
    return `<div class="mode${open ? " open" : ""}">
      <button class="s" data-modeexp="${esc(m)}">
        <div class="n">${open ? "▾" : "▸"} ${esc(label)}</div>
        <div class="m">${esc(short)}</div>
      </button>
      ${open ? `<div class="modebody">
        <div class="note">${esc(desc)}</div>
        <dl class="kv"><dt>${l.modesReq}</dt><dd>${esc(req || "—")}</dd><dt>${l.modesUses}</dt><dd>${esc(uses || "—")}</dd></dl>
        <div class="btnrow"><button data-skel="job:${esc(m)}">＋ ${l.acInsert} ${esc(label)}</button></div>
      </div>` : ""}
    </div>`;
  }).join("");
  box.innerHTML = `<div class="h">MODES · ${modes.length}</div><div class="hint">${l.modesHint}</div><div class="scroll">${cards}</div>`;
}
function refreshAC() {
  const box = document.getElementById("ac");
  if (!box) return;
  if (S.modesView) return renderModes(box);
  const l = L(), sn = getSnips(), ta = document.querySelector("[data-paste]");
  // schema-aware key suggestions for wherever the caret is
  let keysHtml = "";
  if (ta) {
    const kp = caretKeyPrefix();
    if (kp !== null) {
      const ctx = yamlContext(ta.value, ta.selectionStart || 0);
      let keys = levelKeys(ctx.level, ctx.mode);
      if (kp) keys = keys.filter((k) => k.indexOf(kp) > -1);
      if (keys.length) {
        const lbl = ctx.level.toUpperCase() + (ctx.mode ? " · " + esc(ctx.mode) : "");
        keysHtml = `<div class="h">KEYS · ${lbl}</div><div class="scroll">${
          keys.map((k) => `<button class="s" data-key="${esc(k)}"><div class="n">${esc(k)}${CONTAINER_KEYS[k] ? " ⋯" : ""}</div></button>`).join("")
        }</div>`;
      }
    }
  }
  const q = caretQuery();
  const f = (arr) => (q ? arr.filter((x) => x.name.toLowerCase().indexOf(q) > -1) : arr);
  ACL.stages = f(sn.stages); ACL.jobs = f(sn.jobs);
  const sec = (title, arr, kind) => `<div class="h">${title} · ${arr.length}</div><div class="scroll">${
    arr.map((x, i) => `<button class="s" data-snip="${kind}" data-i="${i}">
      <div class="n">${esc(x.name)}</div>
      <div class="m">${kind === "job" && x.mode ? esc(x.mode) + " · " : ""}${l.acFrom} ${esc(x.src)}</div>
    </button>`).join("")
  }</div>`;
  const snips = (sn.stages.length || sn.jobs.length) ? sec(l.acStages, ACL.stages, "stage") + sec(l.acJobs, ACL.jobs, "job") : "";
  const modes = (hints().modes || ["custom_sets"]).filter((m) => m !== "super_sets");
  const newBtns = [`<button class="s" data-skel="workout"><div class="n">＋ Workout</div></button>`,
    `<button class="s" data-skel="stage"><div class="n">＋ Stage</div></button>`]
    .concat(modes.map((m) => `<button class="s" data-skel="job:${esc(m)}"><div class="n">＋ Job · ${esc(m)}</div></button>`)).join("");
  const newHtml = `<div class="h">NEW · skeleton</div><div class="scroll">${newBtns}</div>`;
  box.innerHTML = `<div class="hint">${l.acHint}</div>` + newHtml + keysHtml + snips;
}
// ── smart insert: place a stored/skeleton block where the schema needs it, creating the
// mandatory scaffolding (workout name, stages:, a stage's jobs:) so the result stays valid.
const _reindent = (block, by) => block.replace(/\s+$/, "").split("\n").map((l) => (l.trim() ? " ".repeat(by) + l : "")).join("\n");
const _hasTop = (lines, key) => lines.some((l) => new RegExp("^" + key + "\\s*:").test(l));
function _blockEnd(lines, startIdx, baseIndent) {
  for (let i = startIdx + 1; i < lines.length; i++) { const ln = lines[i]; if (!ln.trim()) continue; if (_ind(ln) <= baseIndent) return i; }
  return lines.length;
}
function insertStageSmart(text, block) {
  const lines = text.trim() === "" ? [] : text.replace(/\s+$/, "").split("\n");
  const stage = _reindent(block, 2).split("\n");
  const stagesIdx = lines.findIndex((l) => /^stages\s*:/.test(l));
  if (stagesIdx === -1) {
    const head = _hasTop(lines, "name") ? [] : ["name: My Workout"];
    return head.concat(lines, ["stages:"], stage).join("\n") + "\n";
  }
  const end = _blockEnd(lines, stagesIdx, 0);
  let out = lines.slice(0, end).concat(stage, lines.slice(end));
  if (!_hasTop(lines, "name")) out = ["name: My Workout"].concat(out);
  return out.join("\n") + "\n";
}
function insertJobSmart(text, block, caretLineIdx) {
  const lines = text.trim() === "" ? [] : text.replace(/\s+$/, "").split("\n");
  const job = _reindent(block, 6).split("\n");
  const stageItems = [];
  lines.forEach((l, i) => { if (/^  -\s/.test(l)) stageItems.push(i); });
  if (!lines.some((l) => /^stages\s*:/.test(l)) || stageItems.length === 0) {
    const head = _hasTop(lines, "name") ? [] : ["name: My Workout"];
    return head.concat(lines.filter((l) => l.trim() !== ""), ["stages:", "  - name: Stage 1", "    jobs:"], job).join("\n") + "\n";
  }
  let target = stageItems[stageItems.length - 1];
  if (typeof caretLineIdx === "number") { for (let k = stageItems.length - 1; k >= 0; k--) { if (stageItems[k] <= caretLineIdx) { target = stageItems[k]; break; } } }
  const stageEnd = _blockEnd(lines, target, 2);
  let jobsIdx = -1;
  for (let i = target + 1; i < stageEnd; i++) { if (/^    jobs\s*:/.test(lines[i])) { jobsIdx = i; break; } }
  let out;
  if (jobsIdx === -1) out = lines.slice(0, stageEnd).concat(["    jobs:"], job, lines.slice(stageEnd));
  else { const jobsEnd = _blockEnd(lines, jobsIdx, 4); out = lines.slice(0, jobsEnd).concat(job, lines.slice(jobsEnd)); }
  if (!_hasTop(lines, "name")) out = ["name: My Workout"].concat(out);
  return out.join("\n") + "\n";
}
// ── skeletons: a correct starter block for a mode, required keys pre-filled with placeholders.
function _ph(key) {
  if (/eccentric|isometric/.test(key)) return "true";
  if (key === "tempo") return '"2-0-1-0"';
  if (key === "ladder_type") return "ascending";
  if (/seconds|minutes|rounds|reps|percent_1rm|rpe|weight|increment_by|total_rounds|distance/.test(key)) return "1";
  return null;
}
function jobSkeleton(mode) {
  const h = hints(), bm = h.job && h.job.byMode && h.job.byMode[mode];
  const req = (bm && bm.required) || ["name", "mode", "exercises"];
  const lines = ["- name: New job", "  mode: " + mode];
  req.forEach((k) => { if (k === "name" || k === "mode" || k === "exercises") return; const ph = _ph(k); lines.push("  " + k + ": " + (ph !== null ? ph : '""')); });
  lines.push("  exercises:", "    - name: New exercise", "      reps: 10");
  return lines.join("\n");
}
function stageSkeleton() {
  const job = jobSkeleton("custom_sets").split("\n").map((l) => (l.trim() ? "    " + l : "")).join("\n");
  return "- name: New stage\n  jobs:\n" + job;
}
function workoutSkeleton() {
  const stage = stageSkeleton().split("\n").map((l) => (l.trim() ? "  " + l : "")).join("\n");
  return 'name: New workout\ndescription: ""\nstages:\n' + stage + "\n";
}
function _setEditor(text) {
  const ta = document.querySelector("[data-paste]");
  if (!ta) return;
  ta.value = text; S.paste = text; ta.focus(); ta.setSelectionRange(text.length, text.length); refreshAC();
}
function insertSnip(kind, i) {
  const ta = document.querySelector("[data-paste]");
  const item = (kind === "stage" ? ACL.stages : ACL.jobs)[i];
  if (!ta || !item) return;
  const caretLineIdx = ta.value.slice(0, ta.selectionStart || 0).split("\n").length - 1;
  _setEditor(kind === "stage" ? insertStageSmart(ta.value, item.yaml) : insertJobSmart(ta.value, item.yaml, caretLineIdx));
}
function insertSkeleton(spec) {
  const ta = document.querySelector("[data-paste]");
  if (!ta) return;
  if (spec === "workout") return _setEditor(ta.value.trim() ? insertStageSmart(ta.value, stageSkeleton()) : workoutSkeleton());
  if (spec === "stage") return _setEditor(insertStageSmart(ta.value, stageSkeleton()));
  if (spec.indexOf("job:") === 0) {
    const caretLineIdx = ta.value.slice(0, ta.selectionStart || 0).split("\n").length - 1;
    return _setEditor(insertJobSmart(ta.value, jobSkeleton(spec.slice(4)), caretLineIdx));
  }
}

function render() {
  const app = document.getElementById("app");
  const html = S.screen === "library" ? viewLibrary()
    : S.screen === "detail" ? viewDetail()
    : S.screen === "player" ? viewPlayer()
    : S.screen === "done" ? viewDone()
    : S.screen === "history" ? viewHistory()
    : viewLoad();
  const active = document.activeElement;
  const keep = active && active.dataset && (active.dataset.paste || active.dataset.res || active.dataset.note || active.dataset.query) ? active.dataset : null;
  app.innerHTML = html;
  if (keep) {
    const sel = keep.paste ? "[data-paste]" : keep.query ? "[data-query]" : keep.note ? "[data-note]" : `[data-res="${keep.res}"]`;
    const el = app.querySelector(sel);
    if (el) { el.focus(); if (el.setSelectionRange && el.type !== "number") el.setSelectionRange(el.value.length, el.value.length); }
  }
  if (S.screen === "load" && (S.auto || S.modesView)) refreshAC();
}

// ── events (delegated)
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-open],[data-view],[data-start],[data-primary],[data-skip],[data-quit],[data-lang],[data-audio],[data-theme],[data-auto],[data-modes],[data-modeexp],[data-snip],[data-key],[data-skel],[data-validate],[data-import]");
  if (!t) return;
  primeAudio();                       // unlock audio on a real user gesture (iOS)
  const d = t.dataset;
  if (d.snip) return insertSnip(d.snip, parseInt(d.i, 10));
  if (d.key) return insertKey(d.key);
  if (d.skel) return insertSkeleton(d.skel);
  if (d.modes) { S.modesView = !S.modesView; if (S.modesView) S.auto = false; return render(); }
  if (d.modeexp) { S.modeOpen = S.modeOpen === d.modeexp ? null : d.modeexp; return refreshAC(); }
  if (d.auto) { S.auto = !S.auto; if (S.auto) S.modesView = false; store.set("rt.auto", S.auto ? "1" : "0"); return render(); }
  if (d.theme) { S.theme = d.theme; store.set("rt.theme", d.theme); applyTheme(d.theme); return render(); }
  if (d.lang) { S.lang = d.lang; store.set("rt.lang", d.lang); document.documentElement.lang = d.lang; return render(); }
  if (d.audio) { S.audio = !S.audio; store.set("rt.audio", S.audio ? "1" : "0"); return render(); }
  if (d.go === "library") return goLibrary();
  if (d.go === "history") return goHistory();
  if (d.go === "load") return goLoad();
  if (d.open) return openWorkout(d.open);
  if (d.view) { S.view = d.view; return render(); }
  if (d.start) return startRun(d.start === "driven");
  if (d.validate) return validatePaste(false);
  if (d.import) return validatePaste(true);
  if (d.skip) return advance();
  if (d.quit) return finish(false);
  if (d.primary) {
    const n = S.timeline[S.si];
    if (!n) return;
    if (n.type === "brief" || n.type === "result") return advance();
    if (n.seg.kind === "stopwatch") { setResult("result_time_seconds", S.up); return advance(); }
    if (!n.seg.duration_seconds) return advance();
    S.paused = !S.paused; return render();
  }
});
document.addEventListener("input", (e) => {
  const d = e.target.dataset || {};
  if (d.paste) { S.paste = e.target.value; refreshAC(); }
  else if (d.query) { S.query = e.target.value; render(); }
  else if (d.note) S.note = e.target.value;
  else if (d.res) {
    const v = parseInt(e.target.value || "0", 10);
    if (d.total) {
      setResult(d.res, v);
      const n = S.timeline[S.si], cur = S.results[n.stage_index + ":" + n.job_index] || {};
      setResult("result_total_reps", Object.keys(cur).filter((k) => k.startsWith("reps_")).reduce((a, k) => a + (cur[k] || 0), 0));
    } else setResult(d.res, v);
  }
});
document.addEventListener("change", (e) => { if (e.target.dataset && e.target.dataset.file) uploadFile(e.target); });
["keyup", "mouseup"].forEach((ev) => document.addEventListener(ev, (e) => {
  if (e.target && e.target.dataset && e.target.dataset.paste) refreshAC();
}));
// space = pause/resume, s = skip (parity with the CLI player hotkeys)
document.addEventListener("keydown", (e) => {
  if (S.screen !== "player" || /input|textarea/i.test(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); document.querySelector("[data-primary]")?.click(); }
  if (e.key === "s") advance();
});

applyTheme(S.theme);
document.documentElement.lang = S.lang;
goLibrary();
flushQueue();                                   // sync any runs left queued from a past offline session
window.addEventListener("online", flushQueue);  // and whenever the network comes back

// ── PWA: register the service worker (caches the app shell; /api/ stays live)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
}
</script>
</body>
