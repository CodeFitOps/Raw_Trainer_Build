# RawTrainer — colour themes (small, consistent palettes).
#
# A theme is just 5 TOKENS. Every UI element (a ROLE) maps to one token in the
# shared `roles:` map below — so the whole app uses ~5 colours, applied the same
# way in every theme. To try a colour family, swap the 5 hex of a palette.
#
#   RAWTRAINER_THEME=green   (amber | paper | slate)     · unset -> `default`
#
# Colours: "#rrggbb" truecolor · a 256 index · or a name ("bright green").

default: green

# ── ROLE → TOKEN (shared by every theme; edit once to re-wire globally) ──────
# accent = structure/headers · fg = main text · dim = secondary ·
# key = hotkeys · alert = errors.  (A role may also take a literal colour.)
roles:
  banner:        accent
  rule:          dim
  lib_header:    accent
  lib_num:       dim
  lib_name:      fg
  section:       accent
  key:           key
  option:        fg
  prompt:        accent
  submenu_title: accent
  wk_name:       accent
  wk_desc:       dim
  stage_name:    accent
  stage_desc:    dim
  job_name:      accent
  job_desc:      dim
  meta_label:    dim
  meta_value:    fg
  ex_name:       fg
  ex_value:      accent
  tag:           dim
  success:       accent
  error:         alert
  info:          fg
  muted:         dim

# ── PALETTES (5 colours each) ────────────────────────────────────────────────
themes:

  green:          # dark — green phosphor, amber keys
    bg: dark
    palette:
      accent: "#3fb96f"
      fg:     "#cfe3d6"
      dim:    "#5f836f"
      key:    "#d8a657"
      alert:  "#e05a4e"

  amber:          # dark — amber CRT, cyan keys
    bg: dark
    palette:
      accent: "#d79a4c"
      fg:     "#ecdcc0"
      dim:    "#957a4f"
      key:    "#6fb3bf"
      alert:  "#e05a4e"

  paper:          # light — green ink on warm paper
    bg: light
    palette:
      accent: "#1f7a3f"
      fg:     "#24322b"
      dim:    "#6d7f73"
      key:    "#b25a00"
      alert:  "#b3261e"

  slate:          # light — indigo ink on cool paper
    bg: light
    palette:
      accent: "#2f4b8f"
      fg:     "#212838"
      dim:    "#6a7488"
      key:    "#9c3b4a"
      alert:  "#b3261e"
