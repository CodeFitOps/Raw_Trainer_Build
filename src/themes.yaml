# RawTrainer — colour themes (palettes by role).
#
# Pick one with the env var:   RAWTRAINER_THEME=retro   (amber | paper | slate)
# If unset, `default` below is used.
#
# Each theme assigns a colour to every ROLE. A colour can be:
#   "#rrggbb"   truecolor (best for tuning palettes; needs a truecolor terminal)
#   0-255       a 256-colour index (e.g. 82)
#   "green"     a basic name, optionally "bright green"
#
# 2 themes are tuned for DARK terminals, 2 for LIGHT ones (bg: is just a hint,
# we never set the background — it's your terminal's). Add/edit freely; every
# theme must define the SAME set of roles (a test enforces it).
#
# ROLES (what each paints):
#   banner        app header box + name + margins
#   rule          the ──── separators
#   lib_header    "LIBRARY · N" line
#   lib_num       the number of each library item
#   lib_name      the workout name of each library item
#   section       menu section headers (WORKOUT / SHOW / …)
#   key           the (c) (l) … hotkeys
#   option        the option labels next to the keys
#   prompt        the input prompt (rt▸)
#   submenu_title the "── name ──" header of a workout submenu
#   wk_name       workout name        (in the workout print)
#   wk_desc       workout description
#   stage_name    stage name
#   stage_desc    stage description
#   job_name      job name
#   job_desc      job description
#   meta_label    job property labels (Rounds / Time / …)
#   meta_value    job property values
#   ex_name       exercise name
#   ex_value      exercise prescription (reps @ weight …)
#   tag           the 🏷 tags line
#   success       success messages
#   error         error messages
#   info          generic text / values
#   muted         dim secondary text

default: retro

themes:

  # ───────────────────────── DARK BACKGROUND ─────────────────────────
  retro:          # green phosphor, amber keys
    bg: dark
    roles:
      banner:        "#35ff6a"
